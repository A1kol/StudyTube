events {
    worker_connections 1024;
}

http {
    # Определяем наши сервисы
    upstream client_api {
        server studytube-client:8080;
    }

    upstream ai_api {
        server studytube-ai:8081;
    }

    server {
        listen 80;

        # 1. Запросы к ИИ (Саммари, чат и т.д.)
        # Ведёт на ai-service:8081
        location /api/v1/ai/ {
            proxy_pass http://ai_api;

            # Разрешаем большие тексты (транскрипты)
            client_max_body_size 20M;

            # Отключаем буферизацию для стриминга ответов от Ollama
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # ИИ может думать долго (10 минут)
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 300s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # 2. Общее API (Авторизация, профили, метаданные видео)
        # Ведёт на client-service:8080
        location /api/ {
            proxy_pass http://client_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Стандартные таймауты для обычных запросов
            proxy_read_timeout 60s;
        }

        # 3. Фронтенд (Next.js / React)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}