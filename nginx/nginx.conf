events {
    worker_connections 1024;
}

http {
    upstream client_api {
        server studytube-client:8080;
    }

    upstream ai_api {
        server studytube-ai:8081;
    }

    server {
        listen 80;

        location /api/v1/ai/ {
            proxy_pass http://ai_api;
            client_max_body_size 20M;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        location /api/ {
            proxy_pass http://client_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }


        location ~ ^/(api|login/oauth2|oauth2)/ {
            proxy_pass http://client_api;

            # Передаем оригинальные заголовки, чтобы Spring видел реальный IP и протокол
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}