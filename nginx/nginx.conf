events {
    worker_connections 1024;
}

http {
    upstream backend_server {
        server backend:8080;
    }

    server {
        listen 80;

        # 1. Специфичная локация для стриминга (ВАЖНО: выше общего /api/)
        location /api/v1/ai/summary {
            proxy_pass http://backend_server;

            # Разрешаем большие тексты (транскрипты)
            client_max_body_size 20M;

            # Отключаем любую буферизацию для стриминга
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Даем ИИ время подумать (5 минут)
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;

            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # 2. Общее API
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Фронтенд
        location / {
            proxy_pass http://studytube-frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}