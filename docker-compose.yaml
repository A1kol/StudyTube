version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studytube-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: studytube
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d studytube"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - studytube-network

  redis:
    image: redis:7-alpine
    container_name: studytube-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - studytube-network

  frontend:
    build: ./frontend
    container_name: studytube-frontend
    restart: always
    environment:
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - studytube-network

  backend:
    build: ./backend
    container_name: studytube-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xmx2g -Xms512m"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/studytube"
      SPRING_DATASOURCE_USERNAME: "user"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_AI_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    networks:
      - studytube-network
    ports:
      - "8080:8080"

  nginx:
    image: nginx:latest
    container_name: studytube-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - studytube-network

networks:
  studytube-network:
    driver: bridge